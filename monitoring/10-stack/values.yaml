global:
  cattle:
    clusterId: c-pzjt7
    clusterName: altera-rke
    psp:
      enabled: false
rkeControllerManager:
  enabled: true
rkeScheduler:
  enabled: true
rkeProxy:
  enabled: true
rkeEtcd:
  enabled: true
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 10GiB
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
grafana:
  service:
    type: NodePort
    nodePort: 32000
  # To expose Grafana through an NGINX Ingress, configure a DNS record and TLS
  # secret, then uncomment and adjust this block. The Ingress can use Grafana's
  # internal ClusterIP service; NodePort can remain enabled if both access paths
  # are wanted.
  # ingress:
  #   enabled: true
  #   ingressClassName: nginx
  #   hosts:
  #     - grafana.example.com
  #   path: /
  #   tls:
  #     - secretName: grafana-tls
  #       hosts:
  #         - grafana.example.com
  persistence:
    enabled: true
    size: 5Gi
  adminPassword: ""
