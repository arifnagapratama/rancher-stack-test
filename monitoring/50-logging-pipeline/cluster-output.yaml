apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterOutput
metadata:
  name: loki
  namespace: cattle-logging-system
spec:
  loki:
    url: http://loki-gateway.cattle-logging-system.svc.cluster.local:80
    # Keep the stable namespace/pod/container labels configured by the plugin;
    # do not promote every arbitrary Pod label into Loki stream labels.
    extract_kubernetes_labels: false
    labels:
      namespace: $.kubernetes.namespace_name
      pod: $.kubernetes.pod_name
      container: $.kubernetes.container_name
      app: $.kubernetes.labels.app
      app_kubernetes_io_name: $.kubernetes.labels.app_kubernetes_io_name
    buffer:
      type: file
      path: /buffers/loki
      chunk_limit_size: 1MB
      total_limit_size: 2GB
      flush_interval: 5s
      flush_mode: interval
      retry_forever: true
