apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterFlow
metadata:
  name: all-to-loki
  namespace: cattle-logging-system
spec:
  filters:
    - parser:
        key_name: message
        reserve_data: true
        remove_key_name_field: false
        emit_invalid_record_to_error: false
        parse:
          type: multi_format
          patterns:
            - format: json
            - format: regexp
              expression: '/^(?<klog_severity>[IWEF])[0-9]{4}[[:space:]]+[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+[[:space:]]+[0-9]+[[:space:]]+[^[:space:]]+\][[:space:]]+(?<klog_message>.*)$/'
            - format: none
    - record_transformer:
        enable_ruby: true
        records:
          - level: '${(record["klog_severity"] || record["severity"] || record["level"]).to_s.downcase.sub(/^e$/, "error").sub(/^i$/, "info").sub(/^w$/, "warning").sub(/^f$/, "critical")}'
  match:
    - select: {}
  globalOutputRefs:
    - loki
