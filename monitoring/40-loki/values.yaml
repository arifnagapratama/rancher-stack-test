deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  limits_config:
    retention_period: 360h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    accessModes:
      - ReadWriteOnce

backend:
  enabled: false
  replicas: 0
read:
  enabled: false
  replicas: 0
write:
  enabled: false
  replicas: 0

gateway:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: true
minio:
  enabled: false
